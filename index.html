<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склад БпЛА — Центр управління</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b08;
  --bg2:#0a0f0c;
  --panel:#0c120e;
  --panel-2:#0e1611;
  --line:rgba(122,168,134,0.13);
  --line-2:rgba(132,184,146,0.26);
  --ink:#cdd8cf;
  --ink-dim:#83948a;
  --ink-faint:#52615a;
  --green:oklch(0.84 0.17 152);
  --green-deep:oklch(0.66 0.15 152);
  --amber:oklch(0.83 0.15 80);
  --red:oklch(0.68 0.20 26);
  --cyan:oklch(0.83 0.10 205);
  --glow:rgba(74,222,128,0.55);
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --disp:"Oswald",sans-serif;
  --sans:"IBM Plex Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* atmosphere */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(120,170,135,0.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,170,135,0.035) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 120% 100% at 50% 0%,#000 30%,transparent 90%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%,rgba(74,222,128,0.06),transparent 55%),
    radial-gradient(100% 100% at 100% 100%,rgba(40,90,60,0.10),transparent 60%);
}
#root{position:relative;z-index:1}

/* scrollbars */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(120,170,135,0.18);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:rgba(120,170,135,0.32)}

.app{max-width:1880px;margin:0 auto;padding:16px 20px 40px}

/* ---------- TOP BAR ---------- */
.topbar{
  display:flex;align-items:center;gap:18px;
  padding:12px 18px;margin-bottom:14px;
  background:linear-gradient(180deg,rgba(18,28,21,0.85),rgba(10,16,12,0.85));
  border:1px solid var(--line-2);
  position:relative;
}
.topbar::before,.topbar::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--green);opacity:.7}
.topbar::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.topbar::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.emblem{
  width:46px;height:46px;flex:none;position:relative;
  display:grid;place-items:center;
}
.emblem .dia{width:34px;height:34px;transform:rotate(45deg);border:2px solid var(--green);box-shadow:0 0 14px rgba(74,222,128,0.35),inset 0 0 10px rgba(74,222,128,0.15)}
.emblem .dot{position:absolute;width:9px;height:9px;background:var(--green);transform:rotate(45deg);box-shadow:0 0 10px var(--glow)}
.unit h1{font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:.06em;line-height:1.05;color:#eaf3ec}
.unit .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--ink-dim);text-transform:uppercase;margin-top:3px}
.topbar .spacer{flex:1}
.metrobox{text-align:right;padding:0 16px;border-left:1px solid var(--line);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.metrobox .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase}
.metrobox .v{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--ink);margin-top:2px}
.clock{font-family:var(--mono);font-weight:500;font-size:30px;letter-spacing:.04em;color:#eaf3ec;line-height:1}
.clock .date{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--ink-dim);margin-top:5px;text-align:right}
.live{
  display:flex;align-items:center;gap:8px;padding:7px 13px;
  border:1px solid rgba(74,222,128,0.4);background:rgba(74,222,128,0.07);
}
.live .pip{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--glow);animation:pulse 1.8s ease-in-out infinite}
.live .txt{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--green)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}

/* ---------- KPI STRIP ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{
  position:relative;padding:14px 16px 13px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent,var(--green-deep));opacity:.8}
.kpi .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--ink-dim);text-transform:uppercase}
.kpi .num{font-family:var(--disp);font-weight:600;font-size:38px;line-height:1;color:#eef5ef;margin-top:8px;letter-spacing:.01em}
.kpi .num .u{font-size:17px;color:var(--ink-dim);font-weight:400;margin-left:3px}
.kpi .foot{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:7px;display:flex;align-items:center;gap:6px}
.kpi.accent-green{--accent:var(--green)}
.kpi.accent-amber{--accent:var(--amber)}
.kpi.accent-red{--accent:var(--red)}
.kpi.accent-cyan{--accent:var(--cyan)}
.trend{font-family:var(--mono);font-size:10px}
.trend.up{color:var(--green)}
.trend.down{color:var(--red)}

/* ---------- LAYOUT ---------- */
.dash{display:grid;grid-template-columns:1fr 372px;gap:14px;align-items:start}
.main{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}

/* ---------- PANEL ---------- */
.panel{
  position:relative;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);
  display:flex;flex-direction:column;
}
.panel::before{content:"";position:absolute;left:8px;top:8px;width:7px;height:7px;border-left:1px solid var(--line-2);border-top:1px solid var(--line-2)}
.panel::after{content:"";position:absolute;right:8px;bottom:8px;width:7px;height:7px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.span2{grid-column:span 2}
.span3{grid-column:span 3}
.span4{grid-column:span 4}
.span6{grid-column:span 6}
.phead{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--line);
}
.phead .idx{font-family:var(--mono);font-size:10px;color:var(--green-deep);letter-spacing:.1em}
.phead .ttl{font-family:var(--disp);font-weight:500;font-size:14.5px;letter-spacing:.13em;text-transform:uppercase;color:#dfe9e1}
.phead .meta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.pbody{padding:15px 16px}

.statusdot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--glow)}
.statusdot.amber{background:var(--amber);box-shadow:0 0 7px rgba(245,200,90,.5)}
.statusdot.red{background:var(--red);box-shadow:0 0 7px rgba(245,110,90,.5)}

/* ---------- READINESS GAUGE ---------- */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.gauge{position:relative;width:188px;height:188px}
.gauge svg{transform:rotate(-90deg);display:block}
.gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .pct{font-family:var(--disp);font-weight:600;font-size:52px;line-height:.9;color:#eef5ef;text-shadow:0 0 24px rgba(74,222,128,.3)}
.gauge .pct .s{font-size:22px;color:var(--green)}
.gauge .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink-dim);margin-top:7px;text-transform:uppercase}
.legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-top:16px}
.legend .li{padding:9px 10px;border:1px solid var(--line);background:rgba(255,255,255,0.012);text-align:center}
.legend .li .n{font-family:var(--disp);font-weight:600;font-size:24px;color:#e7efe9}
.legend .li .l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase;margin-top:2px}
.legend .li .dotline{display:flex;align-items:center;justify-content:center;gap:5px}
.swatch{width:8px;height:8px;flex:none}

/* ---------- FLEET ROWS ---------- */
.fleet{display:flex;flex-direction:column;gap:13px}
.frow{display:grid;grid-template-columns:1fr;gap:7px}
.frow .top{display:flex;align-items:baseline;gap:10px}
.frow .name{font-family:var(--sans);font-weight:600;font-size:13.5px;color:#dde7df}
.frow .tag{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.06em}
.frow .tot{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.frow .tot b{color:#eef5ef;font-weight:500}
.sbar{display:flex;height:13px;background:rgba(255,255,255,0.03);border:1px solid var(--line);overflow:hidden}
.sbar i{height:100%;display:block;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.sbar .rdy{background:linear-gradient(180deg,oklch(0.84 0.17 152),oklch(0.7 0.16 152))}
.sbar .iss{background:repeating-linear-gradient(45deg,oklch(0.83 0.15 80),oklch(0.83 0.15 80) 5px,oklch(0.76 0.14 80) 5px,oklch(0.76 0.14 80) 10px)}
.sbar .rep{background:linear-gradient(180deg,oklch(0.68 0.2 26),oklch(0.56 0.18 26))}
.fleet-key{display:flex;gap:18px;margin-top:2px;padding-top:13px;border-top:1px solid var(--line)}
.fleet-key .k{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.05em}

/* ---------- STOCK / BARS ---------- */
.stock{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:170px 1fr 92px;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid rgba(122,168,134,0.07);transition:background .15s}
.srow:last-child{border-bottom:0}
.srow:hover{background:rgba(122,168,134,0.05)}
.srow .nm{font-size:12.5px;color:#d4ded6;font-weight:500}
.srow .nm small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);font-weight:400;letter-spacing:.04em;margin-top:1px}
.track{position:relative;height:9px;background:rgba(255,255,255,0.04);border:1px solid var(--line)}
.track i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.track .min{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-dim);opacity:.7}
.fill-ok{background:linear-gradient(90deg,var(--green-deep),var(--green))}
.fill-warn{background:linear-gradient(90deg,oklch(0.66 0.13 80),var(--amber))}
.fill-crit{background:linear-gradient(90deg,oklch(0.54 0.17 26),var(--red))}
.srow .qty{font-family:var(--mono);font-size:12.5px;text-align:right;color:#e7efe9}
.srow .qty small{color:var(--ink-faint);font-size:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:2px 7px;border:1px solid currentColor;text-transform:uppercase}
.chip.ok{color:var(--green)}
.chip.warn{color:var(--amber)}
.chip.crit{color:var(--red)}
.chip.info{color:var(--cyan)}

/* ---------- ZONE MAP ---------- */
.zone-map{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(3,86px);gap:8px;
  grid-template-areas:"a a b" "a a c" "d e f"}
.zone{position:relative;border:1px solid var(--line-2);background:rgba(255,255,255,0.014);padding:10px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;transition:.18s;overflow:hidden}
.zone:hover{background:rgba(122,168,134,0.06);border-color:var(--green-deep)}
.zone.sel{border-color:var(--green);background:rgba(74,222,128,0.08);box-shadow:inset 0 0 22px rgba(74,222,128,0.1)}
.zone .zh{display:flex;align-items:center;gap:7px}
.zone .zid{font-family:var(--disp);font-weight:700;font-size:16px;color:#eef5ef}
.zone .zn{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase}
.zone .zocc{font-family:var(--disp);font-weight:600;font-size:22px;color:#dde7df;line-height:1}
.zone .zbar{height:5px;background:rgba(255,255,255,0.05);overflow:hidden}
.zone .zbar i{display:block;height:100%}
.zone .znote{position:absolute;right:8px;top:9px;width:7px;height:7px;border-radius:50%}
.zarea-a{grid-area:a}.zarea-b{grid-area:b}.zarea-c{grid-area:c}.zarea-d{grid-area:d}.zarea-e{grid-area:e}.zarea-f{grid-area:f}
.zone-detail{margin-top:11px;padding:10px 12px;border:1px solid var(--line);background:rgba(255,255,255,0.012);
  display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);min-height:42px}
.zone-detail b{color:#e7efe9;font-weight:500}
.zone-detail .big{font-family:var(--disp);font-size:18px;color:var(--green);font-weight:600}

/* ---------- CHECKED OUT TABLE ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:400}
.tbl td{padding:10px;border-bottom:1px solid rgba(122,168,134,0.07);font-size:12.5px;color:#d2dcd4;vertical-align:middle}
.tbl tr{transition:background .15s}
.tbl tbody tr:hover{background:rgba(122,168,134,0.05)}
.tbl tr:last-child td{border-bottom:0}
.callsign{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:#eaf3ec}
.callsign .av{width:24px;height:24px;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);font-family:var(--disp);font-size:11px;color:var(--green);background:rgba(74,222,128,0.05)}
.itm{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.itm b{color:#dde7df;font-weight:500}
.ago{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}

/* ---------- INCOMING ---------- */
.req{display:flex;flex-direction:column}
.qrow{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid rgba(122,168,134,0.07);transition:background .15s}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:rgba(122,168,134,0.05)}
.qrow .id{font-family:var(--mono);font-size:11px;color:var(--cyan);width:62px;flex:none}
.qrow .desc{flex:1;font-size:12.5px;color:#d4ded6}
.qrow .desc small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:1px}
.qrow .eta{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);text-align:right;width:84px;flex:none}

/* ---------- ACTIVITY LOG ---------- */
.logpanel{max-height:none;display:flex;flex-direction:column}
.logtabs{display:flex;gap:0;border-bottom:1px solid var(--line)}
.logtab{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:9px 4px;text-align:center;
  background:transparent;border:0;border-right:1px solid var(--line);color:var(--ink-dim);cursor:pointer;text-transform:uppercase;transition:.15s}
.logtab:last-child{border-right:0}
.logtab:hover{color:var(--ink);background:rgba(122,168,134,0.04)}
.logtab.on{color:var(--green);background:rgba(74,222,128,0.07)}
.logctrl{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.08em}
.pausebtn{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:4px 10px;border:1px solid var(--line-2);background:transparent;color:var(--ink-dim);cursor:pointer;text-transform:uppercase;transition:.15s}
.pausebtn:hover{color:var(--ink);border-color:var(--green-deep)}
.pausebtn.live{color:var(--green);border-color:rgba(74,222,128,.4)}
.logfeed{overflow-y:auto;max-height:560px;padding:4px 0}
.logrow{display:grid;grid-template-columns:46px 70px 1fr;gap:10px;padding:8px 14px;align-items:start;
  border-bottom:1px solid rgba(122,168,134,0.05);animation:slidein .45s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-7px);background:rgba(74,222,128,0.12)}to{opacity:1;transform:none}}
.logrow .lt{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.logrow .lg{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;padding:2px 0;text-align:center;border:1px solid currentColor;text-transform:uppercase;height:fit-content}
.logrow .lx{font-size:12px;color:#cdd8cf;line-height:1.35}
.logrow .lx b{color:#eaf3ec;font-weight:600}
.lg.issue{color:var(--amber)}.lg.ret{color:var(--green)}.lg.rep{color:var(--red)}.lg.in{color:var(--cyan)}.lg.alert{color:var(--red)}

/* readiness footer note */
.cmdnote{margin-top:14px;padding:11px 14px;border:1px solid var(--line);border-left:2px solid var(--amber);
  background:rgba(245,200,90,0.04);font-size:12px;color:var(--ink);line-height:1.5}
.cmdnote b{color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.12em}

@media(max-width:1380px){
  .dash{grid-template-columns:1fr}
  .rail{position:static}
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:820px){
  .main{grid-template-columns:1fr}
  .span2,.span3,.span4,.span6{grid-column:span 1}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .clock{font-size:22px}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
// ===== data.jsx =====
// ============ ДАНІ СКЛАДУ БпЛА ============
// Вигаданий підрозділ. Усі дані — демонстраційні.

const fmt = (n) => n.toLocaleString("uk-UA").replace(/,/g, " ");

// --- Парк БпЛА: готові / видано / в ремонті ---
const FLEET = [
  { name: "FPV-дрони 7\"",            tag: "FPV-7",   rdy: 218, iss: 96, rep: 22 },
  { name: "FPV-дрони 10\"",           tag: "FPV-10",  rdy: 64,  iss: 18, rep: 9  },
  { name: "Дрони-розвідники Mavic 3", tag: "ISR",     rdy: 31,  iss: 12, rep: 5  },
  { name: "Важкі бомбери",            tag: "HEAVY",   rdy: 6,   iss: 3,  rep: 2  },
  { name: "Крила-розвідники",         tag: "FW-ISR",  rdy: 8,   iss: 2,  rep: 1  },
];
const fleetTotals = FLEET.reduce((a, f) => ({
  rdy: a.rdy + f.rdy, iss: a.iss + f.iss, rep: a.rep + f.rep,
}), { rdy: 0, iss: 0, rep: 0 });
const fleetTotal = fleetTotals.rdy + fleetTotals.iss + fleetTotals.rep;
const operational = fleetTotals.rdy + fleetTotals.iss;
const readinessPct = Math.round((operational / fleetTotal) * 100);

const { useState, useEffect, useRef } = React;

// плавний відлік чисел при завантаженні
function useCountUp(target, dur = 1100) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, start;
    const tick = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / dur, 1);
      const e = 1 - Math.pow(1 - p, 3);
      setV(target * e);
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}

// ---- заголовок панелі ----
function PHead({ idx, title, meta, dot }) {
  return (
    <div className="phead">
      <span className="idx">{idx}</span>
      <span className="ttl">{title}</span>
      <span className="meta">
        {meta}
        {dot && <span className={"statusdot " + dot}></span>}
      </span>
    </div>
  );
}

// ---- KPI плитка ----
function Kpi({ lab, num, unit, accent, foot, decimals = 0 }) {
  const v = useCountUp(num);
  const display = decimals ? v.toFixed(decimals) : Math.round(v);
  return (
    <div className={"kpi accent-" + accent}>
      <div className="lab">{lab}</div>
      <div className="num">{fmt(Number(display))}{unit && <span className="u">{unit}</span>}</div>
      <div className="foot">{foot}</div>
    </div>
  );
}

const TABS = [
  ["all", "Всі"], ["issue", "Видача"], ["ret", "Поверн."], ["rep", "Ремонт"], ["alert", "Тривоги"],
];

function ActivityLog() {
  const [log, setLog] = useState(INITIAL_LOG);
  const [filter, setFilter] = useState("all");
  const [paused, setPaused] = useState(false);
  const idRef = useRef(100);

  useEffect(() => {
    if (paused) return;
    const tick = () => {
      const seed = LOG_SEED[Math.floor(Math.random() * LOG_SEED.length)];
      const d = new Date();
      setLog((prev) => [{ id: idRef.current++, time: `${p2(d.getHours())}:${p2(d.getMinutes())}`, ...seed }, ...prev].slice(0, 60));
    };
    const i = setInterval(tick, 4200 + Math.random() * 3500);
    return () => clearInterval(i);
  }, [paused]);

  const shown = log.filter((l) => filter === "all" || l.g === filter);
  return (
    <div className="panel logpanel">
      <PHead idx="06" title="Журнал активності" meta={<span style={{ color: "var(--green)" }}>● {paused ? "ПАУЗА" : "ЕФІР"}</span>} />
      <div className="logtabs">
        {TABS.map(([k, l]) => (
          <button key={k} className={"logtab" + (filter === k ? " on" : "")} onClick={() => setFilter(k)}>{l}</button>
        ))}
      </div>
      <div className="logctrl">
        <span>ПОДІЙ: {shown.length}</span>
        <button className={"pausebtn" + (paused ? "" : " live")} onClick={() => setPaused((p) => !p)}>
          {paused ? "▶ ВІДНОВИТИ" : "❚❚ ПАУЗА"}
        </button>
      </div>
      <div className="logfeed">
        {shown.map((l) => (
          <div className="logrow" key={l.id}>
            <span className="lt">{l.time}</span>
            <span className={"lg " + l.g}>{l.t}</span>
            <span className="lx" dangerouslySetInnerHTML={{ __html: l.x }}></span>
          </div>
        ))}
      </div>
    </div>
  );
}

}
