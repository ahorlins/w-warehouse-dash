/* ---------------- ПЕРЕМИКАЧ ВАРІАНТІВ ---------------- */
.switcher{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:stretch;gap:0;
  background:#05080a;border-bottom:1px solid rgba(140,170,150,0.22);
  box-shadow:0 6px 24px rgba(0,0,0,0.5);
}
.sw-brand{display:flex;flex-direction:column;justify-content:center;padding:10px 22px;border-right:1px solid rgba(140,170,150,0.16);position:relative;min-width:262px}
.sw-brand .sw-dia{position:absolute;left:22px;top:50%;transform:translateY(-50%) rotate(45deg);width:13px;height:13px;border:2px solid oklch(0.84 0.17 152);box-shadow:0 0 10px rgba(74,222,128,0.45)}
.sw-brand .sw-name{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.05em;color:#e9f2ec;padding-left:26px;white-space:nowrap;line-height:1.15}
.sw-brand .sw-sub{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:#6b7d72;text-transform:uppercase;padding-left:26px;margin-top:3px;white-space:nowrap}
.sw-tabs{display:flex;flex:1;overflow-x:auto}
.sw-tab{flex:1;min-width:158px;display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:9px 16px;background:transparent;border:0;border-right:1px solid rgba(140,170,150,0.1);
  cursor:pointer;text-align:left;transition:.18s;position:relative}
.sw-tab::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:oklch(0.84 0.17 152);transform:scaleX(0);transition:transform .2s;transform-origin:left}
.sw-tab:hover{background:rgba(120,170,135,0.06)}
.sw-tab.on{background:rgba(74,222,128,0.07)}
.sw-tab.on::before{transform:scaleX(1)}
.sw-no{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#5a6b60}
.sw-tab.on .sw-no{color:oklch(0.84 0.17 152)}
.sw-tn{font-family:var(--disp);font-weight:500;font-size:13px;letter-spacing:.03em;color:#b9c7bd;text-transform:uppercase;line-height:1.05;white-space:nowrap}
.sw-tab.on .sw-tn{color:#eef5ef}
.sw-tg{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:#566459;text-transform:uppercase}
.sw-hint{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:9px 20px;border-left:1px solid rgba(140,170,150,0.16);min-width:200px}

const { useState, useEffect, useRef, useCallback } = React;

const WD = ["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
const MN = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const p2 = (n) => String(n).padStart(2,"0");

function useClock(){
  const [now,setNow] = useState(new Date());
  useEffect(()=>{ const i=setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(i); },[]);
  return now;
}
function fmtTime(d){ return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; }
function fmtDate(d){ return `${WD[d.getDay()]} · ${p2(d.getDate())} ${MN[d.getMonth()]} ${d.getFullYear()}`; }

function useCountUp(target, dur=1100){
  const [v,setV]=useState(target);
  useEffect(()=>{
    // якщо вкладка неактивна — показуємо одразу кінцеве значення (без анімації)
    if(typeof document!=="undefined" && document.hidden){ setV(target); return; }
    let raf,start,done=false;
    setV(0);
    const tick=(ts)=>{ if(!start)start=ts; const p=Math.min((ts-start)/dur,1);
      setV(target*(1-Math.pow(1-p,3))); if(p<1)raf=requestAnimationFrame(tick); else done=true; };
    raf=requestAnimationFrame(tick);
    const safety=setTimeout(()=>{ if(!done) setV(target); }, dur+250);
    const onVis=()=>{ if(document.hidden){ setV(target); cancelAnimationFrame(raf); } };
    document.addEventListener("visibilitychange",onVis);
    return ()=>{ cancelAnimationFrame(raf); clearTimeout(safety); document.removeEventListener("visibilitychange",onVis); };
  },[target]);
  return v;
}

// живий журнал — спільний рушій для всіх варіантів
function useLiveLog(intervalBase=4200){
  const [log,setLog]=useState(INITIAL_LOG);
  const [paused,setPaused]=useState(false);
  const idRef=useRef(100);
  useEffect(()=>{
    if(paused) return;
    const tick=()=>{
      const seed=LOG_SEED[Math.floor(Math.random()*LOG_SEED.length)];
      const d=new Date();
      setLog(prev=>[{id:idRef.current++,time:`${p2(d.getHours())}:${p2(d.getMinutes())}`,...seed},...prev].slice(0,60));
    };
    const i=setInterval(tick,intervalBase+Math.random()*3500);
    return ()=>clearInterval(i);
  },[paused,intervalBase]);
  return {log,paused,setPaused};
}

  { key:"board",    no:"05", name:"Дошка готовності",   tag:"статусна дошка",     theme:"dark"  },
  { key:"ledger",   no:"06", name:"Журнал руху",        tag:"добовий облік",      theme:"dark"  },
  { key:"ledgerlt", no:"07", name:"Відомість руху",     tag:"світла довідка",     theme:"light" },
];

function Shell(){
  const [active,setActive] = useState(()=> localStorage.getItem("wh_variant") || "command");
  useEffect(()=>{
    localStorage.setItem("wh_variant",active);
    const v=VARIANTS.find(x=>x.key===active);
    document.body.dataset.theme = v ? v.theme : "dark";
  },[active]);

  const Variants = {
    command: window.VCommand, blueprint: window.VBlueprint,
    brief: window.VBrief, terminal: window.VTerminal, board: window.VBoard,
    ledger: window.VLedger, ledgerlt: window.VLedgerLight,
  };
  const Cur = Variants[active] || (()=> <div style={{padding:40}}>…</div>);
  const meta = VARIANTS.find(v=>v.key===active);

  return (
    <React.Fragment>
      <div className="switcher">
        <div className="sw-brand">
          <span className="sw-dia"></span>
          <span className="sw-name">СЛУЖБА АВІАЦІЇ ТА ППО</span>
          <span className="sw-sub">оперативний склад БпЛА</span>
        </div>
        <div className="sw-tabs">
          {VARIANTS.map(v=>(
            <button key={v.key}
              className={"sw-tab"+(v.key===active?" on":"")}
              onClick={()=>setActive(v.key)}>
              <span className="sw-no">{v.no}</span>
              <span className="sw-tn">{v.name}</span>
              <span className="sw-tg">{v.tag}</span>
            </button>
          ))}
        </div>
        <div className="sw-hint">
          <span className="sw-demo">ДЕМО · {meta.no}/07</span>
          <span className="sw-key">демонстрація варіантів інтерфейсу</span>
        </div>
      </div>
      <div className="stage" key={active}>
        <Cur/>
      </div>
    </React.Fragment>
  );
}

Object.assign(window, {
  useClock, fmtTime, fmtDate, useCountUp, useLiveLog, readinessOf, p2,
  Shell, VARIANTS,
});

      <circle cx="87" cy="87" r={R} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth="11"/>

function BrFiber(){
  const mx=Math.max(...FIBER.map(f=>f.rdy+f.iss+f.rep));
  return(<div>
    {FIBER.map(f=>{const tot=f.rdy+f.iss+f.rep;const w=n=>(n/tot*100)+"%";
      return(<div className="fibrow" key={f.label}>
        <div className="fl">{f.label}<small>{f.note}</small></div>
        <div className="fibbar" style={{width:(tot/mx*100)+"%"}}>
          <i className="a" style={{width:w(f.rdy)}}></i><i className="b" style={{width:w(f.iss)}}></i><i className="c" style={{width:w(f.rep)}}></i></div>
        <div className="fn">{fmt(tot)}</div>
      </div>);})}
    <div className="fkey"><span><i style={{background:"var(--olive)"}}></i>Готові</span><span><i style={{background:"#9aa97e"}}></i>Видано</span><span><i style={{background:"#cf9f56"}}></i>Ремонт</span></div>
  </div>);
}

function VBrief(){
  const now=useClock();
  const t1=PLATFORMS.filter(p=>p.t===1), t2=PLATFORMS.filter(p=>p.t===2);
  const stStat=s=>{const k=accStatus(s);return k==="crit"?["критично","crit"]:k==="warn"?["низько","warn"]:["норма","ok"];};
  return(<div className="v-br"><style dangerouslySetInnerHTML={{__html:VBR_CSS}}/>
    <div className="wrap">
      <div className="doc-top">
        <div>
          <div className="doc-cls">Для службового користування · зведення № 14/06</div>
          <div className="doc-h1">Зведення стану складу БпЛА</div>
          <div className="doc-sub">Служба авіації та ППО · оперативний склад · станом на {fmtDate(now)}</div>
        </div>
        <div className="doc-meta">ДОБА <b>{p2(now.getHours())}:{p2(now.getMinutes())}</b><br/>ПОЗИЦІЙ <b>{fmt(1550)}</b><br/>ЗОН <b>6 / 6</b><br/>ОТРИМУВАЧІВ <b>{activeUnits}</b></div>
      </div>

      <div className="lede">
        <div className="lede-txt">

          Загальний рівень боєготовності <b>{READINESS}%</b>. Критичних позицій постачання, що потребують рішення командира, — <b>{lowStockCount}</b>.
        </div>
        <div className="readbox">
          <div className="rl">Боєготовність парку</div>
          <div className="rn">{READINESS}<span className="s">%</span></div>
          <div className="rrow">
            <div><b>{fmt(fleetTotals.rdy)}</b>готові</div>
            <div><b>{fmt(fleetTotals.iss)}</b>видано</div>
            <div><b>{fmt(fleetTotals.rep)}</b>ремонт</div>
          </div>
        </div>
      </div>

      <div className="sech"><span className="sn">§1</span> Парк FPV за довжиною оптоволокна</div>
      <div className="cols">
        <div className="card"><h3>Розподіл за ОВ <span className="tot">{fmt(fleetTotal)} од.</span></h3><BrFiber/></div>
        <div className="card"><h3>Платформи розвідки <span className="tot">Tier 1</span></h3>
          <table><thead><tr><th>Сімейство</th><th className="r">К-сть</th><th className="r">Готові</th><th className="r">Вартість од.</th></tr></thead>
            <tbody>{t1.map(p=>(<tr key={p.code}><td><span className="pf">{p.fam}</span> <span className="pc">{p.code}</span></td>
              <td className="r stat">{fmt(p.qty)}</td><td className="r stat">{fmt(p.rdy)}</td><td className="r stat">{uahF(p.price)}</td></tr>))}</tbody></table>
        </div>
      </div>

      <div className="sech"><span className="sn">§2</span> Ударні та розвідувальні платформи</div>
      <div className="card"><h3>FPV / ударні системи <span className="tot">Tier 2 · {fmt(t2.reduce((a,p)=>a+p.qty,0))} од.</span></h3>
        <table><thead><tr><th>Сімейство</th><th>Тип</th><th className="r">Всього</th><th className="r">Готові</th><th className="r">Видано</th><th className="r">Ремонт</th><th className="r">Вартість од.</th></tr></thead>
          <tbody>{t2.map(p=>(<tr key={p.code}><td><span className="pf">{p.fam}</span></td>
            <td><span className="tierbadge t2">{TIER_LABEL[p.t]}</span></td>
            <td className="r stat">{fmt(p.qty)}</td><td className="r stat">{fmt(p.rdy)}</td><td className="r stat">{fmt(p.iss)}</td><td className="r stat">{fmt(p.rep)}</td>
            <td className="r stat">{uahF(p.price)}</td></tr>))}</tbody></table>
      </div>

      <div className="sech"><span className="sn">§3</span> Видача підрозділам · постачання</div>
      <div className="cols">
        <div className="card"><h3>Видано в підрозділи <span className="tot">{activeUnits} отримувачів</span></h3>
          <table className="units"><thead><tr><th>Підрозділ</th><th>Майно (вибірка)</th><th className="r">Од.</th></tr></thead>
            <tbody>{UNITS.map(u=>(<tr key={u.u}><td><div className="ucode">{u.u}</div><div className="ufull">{u.full}</div></td>
              <td style={{fontSize:12}}>{u.holds}</td><td className="r stat" style={{fontWeight:600,color:"var(--olive-d)"}}>{u.cnt}</td></tr>))}</tbody></table>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:24}}>
          <div className="card"><h3>Очікувані поставки <span className="tot">{incomingActive} активні</span></h3>
            <table><tbody>{INCOMING.map(q=>{const[lab,cls]=STATUS_LABEL[q.status];return(
              <tr key={q.id}><td><span className="pc">{q.id}</span> <span className="pf" style={{fontWeight:500}}>{q.desc}</span></td>
                <td className="stat">{q.qty}</td><td className="r"><span className={"pill "+cls}>{lab}</span></td><td className="r stat">{q.eta}</td></tr>);})}</tbody></table>
          </div>
          <div className="alerts"><h3>⚠ Позиції нижче мінімального запасу</h3>
            {lowStock.map(s=>{const[lab]=stStat(s);return(<div className="alert-li" key={s.code}>
              <span className="marker">›</span><span className="an"><b>{s.nm}</b> — наявно {fmt(s.qty)} {s.unit}, мін. норма {fmt(s.min)}</span>
              <span className="av">{lab}</span></div>);})}
          </div>
        </div>
      </div>

      <div className="sech"><span className="sn">§4</span> На рішення командира</div>
      <div className="decide"><h3>Потрібне рішення</h3>
        <p>Поставку <b>#2207 (щогли телескопічні Avenger 10–12 м, 24 шт)</b> не погоджено. Антенно-щоглове майно у критичному дефіциті
        (наявно <b>22</b> при нормі <b>30</b>), що обмежує розгортання станцій керування на нових позиціях. <b>Прошу погодити закупівлю</b> або
        перерозподіл із резерву РР.</p>
      </div>

      <div className="sign"><span>Уклав: черговий складу · Служба авіації та ППО</span><span>Документ демонстраційний · дані умовні</span></div>
    </div>
  </div>);
}
window.VBrief=VBrief;

              <tbody>{FIBER.map(f=>{const tot=f.rdy+f.iss+f.rep;const mx=Math.max(...FIBER.map(x=>x.rdy+x.iss+x.rep));

          </div>
        </div>

        <div>
          <div className="blk"><span className="bh r">[ ТРИВОГИ ЗАПАСУ · {lowStockCount} ]</span>

              <tbody>{ACCESSORIES.map(s=>{const k=accStatus(s);const st=k==="crit"?"КРИТ":k==="warn"?"НИЗ":"НОРМ";
                return(<tr key={s.code}><td className="cd">{s.code}</td><td className="nm">{s.nm}</td>
                  <td className={"r "+qcls(s)}>{fmt(s.qty)}</td><td className="r cd">{fmt(s.min)}</td><td className={qcls(s)}>{st}</td></tr>);})}</tbody></table>
          </div>

          <div className="blk"><span className="bh">[ ВИДАНО ПІДРОЗДІЛАМ ]</span>
            <table className="led"><thead><tr><th>ПІДРОЗДІЛ</th><th>МАЙНО</th><th className="r">ОД.</th><th>ОСТ.</th></tr></thead>
              <tbody>{UNITS.map(u=>(<tr key={u.u}><td className="nm" style={{color:"var(--amb)"}}>{u.u}</td>

          </div>

          <div className="blk"><span className="bh">[ ОЧІКУВАНІ ПОСТАВКИ ]</span>
            <table className="led"><thead><tr><th>ЗАЯВКА</th><th>НОМЕНКЛАТУРА</th><th className="r">К-СТЬ</th><th>СТАТУС</th><th className="r">ETA</th></tr></thead>
              <tbody>{INCOMING.map(q=>{const[lab]=STATUS_LABEL[q.status];const c=q.status==="warn"?"qwarn":q.status==="in"?"":"qok";
                return(<tr key={q.id}><td className="cd">{q.id}</td><td className="nm">{q.desc}</td><td className="r">{q.qty}</td>
                  <td className={c} style={q.status==="in"?{color:"var(--cy)"}:{}}>{lab}</td><td className="r cd">{q.eta}</td></tr>);})}</tbody></table>
          </div>
        </div>
      </div>

      <div className="blk"><span className="bh g">[ ЖУРНАЛ ПОДІЙ · LIVE ]</span><TmLog/></div>

      <div className="foot">

        <span><kbd>F5</kbd>оновити</span><span><kbd>F9</kbd>звіт</span>
        <span style={{marginLeft:"auto"}}>root@sklad-bpla:~# <span className="cur"></span></span>
      </div>
    </div>
  </div>);
}

function KCard({name,qty,kk,tag,tagcls,meta,barPct}){
  return(<div className={"kc "+kk}>
    <div className="kt"><div className="kn">{name}</div><div className="kq">{fmt(qty)}</div></div>
    <div className="km">{tag&&<span className={"tag "+tagcls}>{tag}</span>}{meta&&<span className="meta">{meta}</span>}</div>
    {barPct!=null&&<div className="kbar"><i style={{width:barPct+"%"}}></i></div>}
  </div>);
}

function BdGauge(){
  const pct=useCountUp(READINESS,1300);const R=34,C=2*Math.PI*R,off=C*(1-pct/100);
  return(<div className="gauge2">
    <div className="gc"><svg width="84" height="84" viewBox="0 0 84 84">
      <circle cx="42" cy="42" r={R} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth="7"/>
      <circle cx="42" cy="42" r={R} fill="none" stroke="oklch(.82 .16 152)" strokeWidth="7" strokeLinecap="round"
        strokeDasharray={C} strokeDashoffset={off} style={{filter:"drop-shadow(0 0 6px rgba(74,222,128,.5))"}}/></svg>
      <div className="gp">{Math.round(pct)}%</div></div>
    <div className="gx">Готові <b style={{color:"var(--green)"}}>{fmt(fleetTotals.rdy)}</b><br/>Видано <b style={{color:"var(--amber)"}}>{fmt(fleetTotals.iss)}</b><br/>Ремонт <b style={{color:"var(--red)"}}>{fmt(fleetTotals.rep)}</b></div>
  </div>);
}

function BdFeed(){
  const {log}=useLiveLog(3800);
  return(<div className="feed">{log.slice(0,12).map(l=>(
    <div className="fl" key={l.id}><span className="ft">{l.time}</span>
      <span className="fx"><span className={"fg "+l.g}></span><span dangerouslySetInnerHTML={{__html:l.x}}></span></span></div>))}</div>);
}

          <div className="alerts">{lowStock.map(s=>{const k=accStatus(s);const col=k==="crit"?"var(--red)":"var(--amber)";
            return(<div className="al" key={s.code}><span className="adot" style={{background:col,boxShadow:"0 0 6px "+col}}></span>

      </div>

  </div>);
}

// підрахунки
MOVEMENT.forEach(grp=>{
  grp.items.forEach(it=>{ it.close = it.op + it.rec - it.iss; it.delta = it.rec - it.iss; });
  grp.tOp  = grp.items.reduce((a,i)=>a+i.op,0);
  grp.tRec = grp.items.reduce((a,i)=>a+i.rec,0);
  grp.tIss = grp.items.reduce((a,i)=>a+i.iss,0);
  grp.tClose = grp.items.reduce((a,i)=>a+i.close,0);
});
const MV_TOT = {
  op:    MOVEMENT.reduce((a,g)=>a+g.tOp,0),
  rec:   MOVEMENT.reduce((a,g)=>a+g.tRec,0),
  iss:   MOVEMENT.reduce((a,g)=>a+g.tIss,0),
  close: MOVEMENT.reduce((a,g)=>a+g.tClose,0),
};
const MV_MOVEMAX = Math.max(...MOVEMENT.flatMap(g=>g.items.map(i=>Math.max(i.rec,i.iss))));
const MV_POSITIONS = MOVEMENT.reduce((a,g)=>a+g.items.length,0);
const MV_MOVED = MOVEMENT.reduce((a,g)=>a+g.items.filter(i=>i.rec||i.iss).length,0);

// ---- ЕКСПОРТ CSV (відкривається в Excel; роздільник ; · UTF-8 BOM) ----
function exportMovementCSV(){
  const esc = (v)=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows = [["Майно","Код","Наявність (початок)","Отримано","Видано","Залишок (кінець)"]];
  MOVEMENT.forEach(g=>{
    rows.push([g.g.toUpperCase()]);
    g.items.forEach(it=>rows.push([it.nm,it.code,it.op,it.rec,it.iss,it.close]));
    rows.push(["Підсумок · "+g.g.split("·")[0].trim(),"",g.tOp,g.tRec,g.tIss,g.tClose]);
  });
  rows.push(["УСЬОГО ПО СКЛАДУ","",MV_TOT.op,MV_TOT.rec,MV_TOT.iss,MV_TOT.close]);
  const csv = "\uFEFF" + rows.map(r=>r.map(esc).join(";")).join("\r\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "dovidka_ruh_majna_02-06-2026.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
window.exportMovementCSV = exportMovementCSV;

    <span className="seg out" style={{width:outW+"%"}}></span>
    <span className="seg in" style={{width:inW+"%"}}></span>

}

                    <span>витрата <b className="pa">−{fmt(grp.tIss)}</b></span>
                  </span>
                </div>
              </td></tr>

              {grp.rows.map((it,i)=>{
                const moved = it.rec || it.iss;
                const dcls = it.delta>0?"up":it.delta<0?"down":"flat";
                const dtxt = it.delta>0?"▲ +"+fmt(it.delta):it.delta<0?"▼ −"+fmt(-it.delta):"без змін";
                return(
                  <tr className={"row"+(moved?" moved":"")} key={it.code}>
                    <td className="cnum">{i+1}</td>
                    <td className="cname"><div className="nm">{it.nm}</div><div className="cd">{it.code} · шт</div></td>
                    <td className="open">{fmt(it.op)}</td>
                    <td>{num(it.rec,"rec")}</td>
                    <td>{num(it.iss,"iss")}</td>
                    <td><span className="close">{fmt(it.close)}</span>
                      <span className={"delta "+dcls}>{dtxt}</span></td>
                    <td className="cmove"><MoveBar rec={it.rec} iss={it.iss} mounted={mounted}/></td>
                  </tr>
                );
              })}

              <tr className="sub">
                <td></td>
                <td className="sl">Підсумок · {grp.g.split("·")[0].trim()}</td>
                <td>{fmt(grp.tOp)}</td>
                <td><span className="pg">+{fmt(grp.tRec)}</span></td>
                <td><span className="pa">−{fmt(grp.tIss)}</span></td>
                <td><span className="sc">{fmt(grp.tClose)}</span></td>
                <td className="cmove"></td>
              </tr>
            </tbody>
          ))}

          <tfoot><tr>
            <td className="fl" colSpan={2}>Усього по складу · {tab==="all"?"повний реєстр":LG_TABS.find(t=>t[0]===tab)[1]}</td>
            <td>{fmt(groups.reduce((a,g)=>a+g.tOp,0))}</td>
            <td><span className="pg">+{fmt(groups.reduce((a,g)=>a+g.tRec,0))}</span></td>
            <td><span className="pa">−{fmt(groups.reduce((a,g)=>a+g.tIss,0))}</span></td>
            <td>{fmt(groups.reduce((a,g)=>a+g.tClose,0))}</td>
            <td className="cmove"></td>
          </tr></tfoot>
        </table>
      </div>

      {/* НИЗ */}
      <div className="foot">
        <div className="note"><b>Увага командиру</b><br/>
          Найбільший добовий оборот — <b style={{color:"#dde8df"}}>FPV ОВ 10 км</b> (прихід +300, видача −264). Антенно-щоглове майно
          (Avenger) видано −2 при критичному залишку <b style={{color:"#dde8df"}}>20</b> од. — потрібне погодження поставки #2207.</div>
        <div className="legend">
          <div className="lk"><span className="sw" style={{background:"linear-gradient(90deg,var(--green-d),var(--green))"}}></span> отримано (прихід)</div>
          <div className="lk"><span className="sw" style={{background:"repeating-linear-gradient(-45deg,var(--amber),var(--amber) 4px,var(--amber-d) 4px,var(--amber-d) 8px)"}}></span> видано (витрата)</div>
        </div>
      </div>

      <div className="sign">
        <span>Уклав: черговий складу · Служба авіації та ППО</span>
        <span>Журнал руху · оновлюється щодоби о 00:00 · дані демонстраційні</span>
      </div>

    </div>
  </div>);
}
window.VLedger = VLedger;

function MoveBarL({rec,iss,mounted}){
  const inW = mounted ? (rec/MV_MOVEMAX*50) : 0;
  const outW = mounted ? (iss/MV_MOVEMAX*50) : 0;
  return(<div className="mbar">
    <span className="axis"></span>
    <span className="seg out" style={{width:outW+"%"}}></span>
    <span className="seg in" style={{width:inW+"%"}}></span>
  </div>);
}
function numL(n, cls){
  return n===0 ? <span className="zero">—</span> : <span className={cls}>{fmt(n)}</span>;
}

function VLedgerLight(){
  const now = useClock();
  const [tab,setTab] = useState("all");
  const [onlyMoved,setOnlyMoved] = useState(false);
  const [mounted,setMounted] = useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setMounted(true),140); return ()=>clearTimeout(t); },[]);

  const groups = MOVEMENT
    .filter(g => tab==="all" || g.key===tab)
    .map(g => ({...g, rows: g.items.filter(i => !onlyMoved || i.rec || i.iss)}))
    .filter(g => g.rows.length);
  const turnover = MV_TOT.rec + MV_TOT.iss;

  return(<div className="v-lgl"><style dangerouslySetInnerHTML={{__html:VLGL_CSS}}/>
    <div className="wrap">

      <div className="dochead">
        <div>
          <div className="cls">Для службового користування · відомість № 07/07</div>

          <div className="sub">Служба авіації та протиповітряної оборони · оперативний склад БпЛА · станом на <b>02.06.2026</b></div>
        </div>
        <div className="meta">
          <div className="clk">{fmtTime(now)}</div>
          {fmtDate(now)}<br/>
          ПОЗИЦІЙ <b>{MV_POSITIONS}</b> · РУХ <b>{MV_MOVED}</b><br/>
          АРКУШ <b>1/1</b> · РЕД. 07
        </div>
      </div>

      <div className="equation">
        <div className="eq">
          <div className="el">Наявність · на початок доби</div>
          <div className="en">{fmt(MV_TOT.op)}</div>
          <div className="ef">одиниць станом на 00:00</div>
        </div>
        <div className="op plus">+</div>
        <div className="eq rec">
          <div className="el">Отримано · прихід</div>
          <div className="en">{fmt(MV_TOT.rec)}</div>
          <div className="ef">оприбутковано за добу</div>
        </div>
        <div className="op minus">−</div>
        <div className="eq iss">
          <div className="el">Видано · витрата</div>
          <div className="en">{fmt(MV_TOT.iss)}</div>
          <div className="ef">передано в підрозділи</div>
        </div>
        <div className="op">=</div>
        <div className="eq close">
          <div className="el">Залишок · на кінець доби</div>
          <div className="en">{fmt(MV_TOT.close)}</div>
          <div className="ef">оборот за добу {fmt(turnover)} од.</div>
        </div>
      </div>

      <div className="toolbar">
        <div className="tabs">
          {LG_TABS.map(([k,l])=>(
            <button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>
          ))}
        </div>
        <button className={"toggle"+(onlyMoved?" on":"")} onClick={()=>setOnlyMoved(v=>!v)}>
          <span className="box">{onlyMoved?"✓":""}</span> Лише рух за добу
        </button>
        <button className="toggle exp" onClick={exportMovementCSV}>↓ Експорт CSV</button>
        <span className="tb-right">показано позицій: <b>{groups.reduce((a,g)=>a+g.rows.length,0)}</b> / {MV_POSITIONS}</span>
      </div>

      <div className="ledger">
        <table>
          <thead><tr>
            <th className="l" style={{width:42}}>№</th>
            <th className="l">Майно</th>
            <th>Наявність<span className="u">на початок</span></th>
            <th>Отримано<span className="u">прихід ▲</span></th>
            <th>Видано<span className="u">витрата ▼</span></th>
            <th>Залишок<span className="u">на кінець</span></th>
            <th className="c cmove">Рух за добу</th>
          </tr></thead>

          {groups.map(grp=>(
            <tbody key={grp.key}>
              <tr className="grp"><td colSpan={7}>
                <div className="gt">
                  <span className="gi">{grp.g}</span>
                  <span className="gc">{grp.rows.length} поз.</span>
                  <span className="gspark">
                    <span>прихід <b className="pg">+{fmt(grp.tRec)}</b></span>
                    <span>витрата <b className="pa">−{fmt(grp.tIss)}</b></span>
                  </span>
                </div>
              </td></tr>

              {grp.rows.map((it,i)=>{
                const moved = it.rec || it.iss;
                const dcls = it.delta>0?"up":it.delta<0?"down":"flat";
                const dtxt = it.delta>0?"▲ +"+fmt(it.delta):it.delta<0?"▼ −"+fmt(-it.delta):"без змін";
                return(
                  <tr className={"row"+(moved?" moved":"")} key={it.code}>
                    <td className="cnum">{i+1}</td>
                    <td className="cname"><div className="nm">{it.nm}</div><div className="cd">{it.code} · шт</div></td>
                    <td className="open">{fmt(it.op)}</td>
                    <td>{numL(it.rec,"rec")}</td>
                    <td>{numL(it.iss,"iss")}</td>
                    <td><span className="clos">{fmt(it.close)}</span>
                      <span className={"delta "+dcls}>{dtxt}</span></td>
                    <td className="cmove"><MoveBarL rec={it.rec} iss={it.iss} mounted={mounted}/></td>
                  </tr>
                );
              })}

              <tr className="sub">
                <td></td>
                <td className="sl">Підсумок · {grp.g.split("·")[0].trim()}</td>
                <td>{fmt(grp.tOp)}</td>
                <td><span className="pg">+{fmt(grp.tRec)}</span></td>
                <td><span className="pa">−{fmt(grp.tIss)}</span></td>
                <td><span className="sc">{fmt(grp.tClose)}</span></td>
                <td className="cmove"></td>
              </tr>
            </tbody>
          ))}

          <tfoot><tr>
            <td className="fl" colSpan={2}>Усього по складу · {tab==="all"?"повний реєстр":LG_TABS.find(t=>t[0]===tab)[1]}</td>
            <td>{fmt(groups.reduce((a,g)=>a+g.tOp,0))}</td>
            <td><span className="pg">+{fmt(groups.reduce((a,g)=>a+g.tRec,0))}</span></td>
            <td><span className="pa">−{fmt(groups.reduce((a,g)=>a+g.tIss,0))}</span></td>
            <td>{fmt(groups.reduce((a,g)=>a+g.tClose,0))}</td>
            <td className="cmove"></td>
          </tr></tfoot>
        </table>
      </div>

      <div className="foot">
        <div className="note"><b>Увага командиру.</b> Найбільший добовий оборот — <b style={{color:"var(--ink)"}}>FPV ОВ 10 км</b> (прихід +300, видача −264).
          Антенно-щоглове майно (Avenger) видано −2 при критичному залишку <b style={{color:"var(--ink)"}}>20</b> од. — потрібне погодження поставки #2207.</div>
        <div className="legend">
          <div className="lk"><span className="sw" style={{background:"linear-gradient(90deg,var(--green-soft),var(--green))"}}></span> отримано (прихід)</div>
          <div className="lk"><span className="sw" style={{background:"repeating-linear-gradient(-45deg,var(--amber),var(--amber) 4px,var(--amber-soft) 4px,var(--amber-soft) 8px)"}}></span> видано (витрата)</div>
        </div>
      </div>

      <div className="sign">
        <span>Уклав: черговий складу · Служба авіації та ППО</span>
        <span>Відомість руху · оновлюється щодоби о 00:00 · дані демонстраційні</span>
      </div>

    </div>
  </div>);
}
window.VLedgerLight = VLedgerLight;
